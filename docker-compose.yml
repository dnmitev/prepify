services:
  # pgvector-enabled Postgres for application data (post-exam training embeddings).
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prepify
      POSTGRES_PASSWORD: prepify
      POSTGRES_DB: prepify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Temporal persistence (separate from app DB). Not published to the host to avoid clashing with `postgres` on 5432.
  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    expose:
      - "5432"
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      - temporal-postgresql
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    volumes:
      # Required: auto-setup validates this file at startup (see temporalio/docker-compose)
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  # Local embedding server (OpenAI-compatible /v1/embeddings). BGE small = 384-dim (matches DB migration).
  # On Apple Silicon this image is amd64; use a remote embedding API in .env if it fails to start.
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    platform: linux/amd64
    command: ["--model-id", "BAAI/bge-small-en-v1.5", "--port", "80"]
    ports:
      - "8089:80"
    volumes:
      - tei_cache:/data

  # Chat LLM in Docker (optional). Default stack does NOT start this — use host `ollama serve` (see README).
  # Enable: docker compose --profile ollama up -d
  # Explicit DNS often fixes registry pull timeouts inside Docker Desktop / VPN setups.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  temporal_pgdata:
  tei_cache:
  ollama_data:
